name: lapredigital-customers

services:
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/docker/Node.Dockerfile
      target: toolchain
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    working_dir: /workspace
    environment:
      TZ: America/Lima
      AI_PROVIDER: chatgpt
      NPM_CONFIG_CACHE: /home/node/.npm
      EVE_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - npm_cache:/home/node/.npm
      - eve_state:/workspace/apps/server/.eve
      - keyring_state:/home/node/.local/share/keyrings

  server:
    profiles: [app]
    extends:
      service: tools
    environment:
      OWNER_PERSONAL_ID: ${OWNER_PERSONAL_ID:-}
      OWNER_ACCESS_TOKEN: ${OWNER_ACCESS_TOKEN:-}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-host.docker.internal}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-LaPreDigital_Customers}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_ENCRYPT: ${SQLSERVER_ENCRYPT:-true}
      SQLSERVER_TRUST_SERVER_CERTIFICATE: ${SQLSERVER_TRUST_SERVER_CERTIFICATE:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [npm, run, dev:server]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/eve/v1/health'); if (!r.ok) process.exit(1);"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    stop_grace_period: 20s

volumes:
  node_modules:
  npm_cache:
  eve_state:
  keyring_state:
